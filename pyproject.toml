[project]
name = "minerva-can-fixdat"
version = "0.1.0"
description = "GUI tool that downloads missing ROMs via qBittorrent from the Myrient Archive."
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.11.0",
    "PyQt6-sip>=13.11",
    "requests>=2.31",
    "libtorrent>=2.0.8",
    "superqt>=0.6.6",
    "qtawesome>=1.3.0",
    "pyqtgraph>=0.13.3",
    "internetarchive>=5.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4.0",
    "mypy>=1.10",
    "ruff>=0.5",
]
visual = [
    "scikit-image>=0.22",
    "Pillow>=10.0",
]

# ── Ruff ───────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
extend-exclude = [
    ".opencode",   # vendored skill scripts
    ".bin",        # vendored binary
    "design-system",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names, etc.)
    "W",    # pycodestyle warnings
    "I",    # isort (import ordering)
]
ignore = [
    "E501",  # line too long — handled by formatter, not enforced
]

[tool.ruff.lint.per-file-ignores]
# Test files may use unused imports for side-effect registration
"tests/*" = ["F401"]

# ── Mypy ───────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Phase 1: check the core modules that were already cleaned up.
# Expand this list as more modules pass.
files = [
    "minerva_db.py",
    "minerva_qbit.py",
    "minerva_state.py",
    "minerva/domain/reports.py",
    "minerva/services/report_acquisition.py",
]
