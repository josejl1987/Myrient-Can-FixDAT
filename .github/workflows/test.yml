name: Test

on:
  push:
    branches: [main, develop, 'feature/**', 'chore/**', 'refactor/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        # 3.14 may fail on some Qt bindings — allow failure
        exclude:
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --timeout=120
        env:
          QT_QPA_PLATFORM: offscreen
          CI: true

      - name: Verify PyQt6 import
        run: python -c "from PyQt6 import QtCore, QtGui, QtWidgets; print('PyQt6 imports OK')"
        env:
          QT_QPA_PLATFORM: offscreen
